name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Desktop Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Check JavaScript
        run: node --check docs/app.mjs
      - name: Include latest release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '{tag_name, published_at, assets: [.assets[] | {name, size, browser_download_url}]}' > docs/release.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          name: github-pages
          path: docs
          retention-days: 7
      - name: Verify Pages artifact upload
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
      - name: Deploy uploaded Pages artifact
        uses: actions/github-script@v7
        id: deploy
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const idToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            core.setOutput('page_url', deployment.page_url);
            for (let attempt = 0; attempt < 120; attempt++) {
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo,
                deployment_id: deployment.id
              });
              if (status.status === 'succeed') return;
              if (['errored', 'canceled', 'failed'].includes(status.status)) {
                throw new Error('Pages deployment failed: ' + JSON.stringify(status));
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment timed out');
