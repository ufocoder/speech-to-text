name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match Cargo.toml version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build macOS apps
        run: ./scripts/build-macos.sh

      - name: Archive macOS apps
        run: |
          for arch in arm64 x86_64; do
            ditto -c -k --keepParent "dist/macos/$arch/Speech to Text.app" \
              "dist/macos/speech-to-text-${GITHUB_REF_NAME}-macos-$arch.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build Windows x64
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive Windows executable
        run: |
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/speech-to-text.exe -DestinationPath "speech-to-text-${env:GITHUB_REF_NAME}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: speech-to-text-*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Speech to Text $GITHUB_REF_NAME" --generate-notes
