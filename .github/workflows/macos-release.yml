name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match Cargo.toml version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build macOS apps
        run: ./scripts/build-macos.sh

      - name: Archive macOS apps
        run: |
          for arch in arm64 x86_64; do
            ditto -c -k --keepParent "dist/macos/$arch/Speech to Text.app" \
              "dist/macos/speech-to-text-${GITHUB_REF_NAME}-macos-$arch.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build Windows x64
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows executable and Visual C++ runtime
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ tools were not found' }

          $redistRoot = Join-Path $install 'VC/Redist/MSVC'
          $crt = Get-ChildItem $redistRoot -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } |
            Where-Object { Test-Path (Join-Path $_ 'vcruntime140_1.dll') } |
            Select-Object -First 1
          if (-not $crt) { throw 'The x64 Visual C++ runtime was not found' }

          $files = @('target/x86_64-pc-windows-msvc/release/speech-to-text.exe')
          $files += (Get-ChildItem $crt -Filter '*.dll' -File).FullName
          $archive = "speech-to-text-${env:GITHUB_REF_NAME}-windows-x64.zip"
          Compress-Archive -LiteralPath $files -DestinationPath $archive
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            foreach ($name in @('speech-to-text.exe', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
              if (-not $zip.GetEntry($name)) { throw "Windows archive is missing $name" }
            }
          } finally {
            $zip.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: speech-to-text-*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Speech to Text $GITHUB_REF_NAME" --generate-notes
