[package]
name = "speech-to-text"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
cpal = "0.16"
gpui-kit = "=0.9.1"
hound = "3.5"
futures = "0.3"
memmap2 = "0.9"
tempfile = "3"
sherpa-onnx = "=2.0.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "half", "api-20", "alternative-backend"] }
half = "2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
ureq = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "4.2.4"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
